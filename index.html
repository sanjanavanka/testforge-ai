<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TestForge AI — Automotive Test & Automation Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter','Segoe UI',Arial,sans-serif; }
  body { background:#F5F5F7; color:#1A237E; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  /* Top Nav */
  .topnav { background:#1A237E; color:#fff; display:flex; align-items:center; padding:0 20px; height:56px; box-shadow:0 2px 6px rgba(0,0,0,.15); flex-shrink:0; }
  .topnav .logo { font-weight:700; font-size:18px; margin-right:30px; }
  .topnav .logo span { color:#FF6F00; }
  .topnav nav { display:flex; gap:4px; flex:1; flex-wrap:wrap; }
  .topnav nav button { background:transparent; color:#fff; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; font-size:13px; }
  .topnav nav button:hover, .topnav nav button.active { background:rgba(255,255,255,.15); }
  .topnav .user { font-size:13px; opacity:.9; }

  /* Layout */
  .layout { flex:1; display:flex; overflow:hidden; }
  .sidebar { width:220px; background:#fff; border-right:1px solid #e0e0e0; padding:16px 0; overflow-y:auto; flex-shrink:0; }
  .sidebar h4 { font-size:11px; text-transform:uppercase; color:#888; padding:12px 20px 6px; letter-spacing:1px; }
  .sidebar a { display:block; padding:9px 20px; color:#333; text-decoration:none; font-size:14px; border-left:3px solid transparent; cursor:pointer; }
  .sidebar a:hover { background:#f0f2ff; }
  .sidebar a.active { background:#f0f2ff; border-left-color:#FF6F00; color:#1A237E; font-weight:600; }
  .workspace { flex:1; overflow-y:auto; padding:24px; }

  /* Status */
  .statusbar { background:#263238; color:#b0bec5; font-size:12px; padding:6px 20px; display:flex; gap:24px; flex-shrink:0; flex-wrap:wrap; }
  .statusbar .ok { color:#69F0AE; }

  /* Cards */
  .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:18px; }
  .card h2 { font-size:16px; margin-bottom:12px; color:#1A237E; }
  .card h3 { font-size:14px; margin:12px 0 8px; color:#333; }

  .kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:18px; }
  .kpi { background:#fff; border-radius:10px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .kpi .label { font-size:12px; color:#777; text-transform:uppercase; letter-spacing:.5px; }
  .kpi .value { font-size:26px; font-weight:700; color:#1A237E; margin-top:4px; }
  .kpi .delta { font-size:11px; color:#2E7D32; margin-top:4px; }

  button.primary { background:#FF6F00; color:#fff; border:none; padding:9px 16px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:600; }
  button.primary:hover { background:#e65100; }
  button.secondary { background:#fff; color:#1A237E; border:1px solid #1A237E; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
  button.secondary:hover { background:#f0f2ff; }
  button.danger { background:#fff; color:#C62828; border:1px solid #C62828; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
  .actions { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid #eee; }
  th { background:#f9fafc; color:#555; font-weight:600; font-size:12px; text-transform:uppercase; }
  tr:hover { background:#fafbff; }
  tr.clickable { cursor:pointer; }

  .badge { display:inline-block; padding:3px 8px; border-radius:12px; font-size:11px; font-weight:600; margin:2px; }
  .badge.green { background:#E8F5E9; color:#2E7D32; }
  .badge.yellow { background:#FFF8E1; color:#F57F17; }
  .badge.red { background:#FFEBEE; color:#C62828; }
  .badge.blue { background:#E3F2FD; color:#1565C0; }
  .badge.grey { background:#ECEFF1; color:#455A64; }

  .gen-layout { display:grid; grid-template-columns:1fr 2fr 1fr; gap:14px; }
  @media (max-width:1100px) { .gen-layout { grid-template-columns:1fr; } }
  .pane { background:#fff; border-radius:10px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); min-height:500px; }
  .pane h3 { font-size:14px; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid #eee; color:#1A237E; }

  .tabs { display:flex; gap:4px; border-bottom:2px solid #eee; margin-bottom:14px; flex-wrap:wrap; }
  .tabs button { background:none; border:none; padding:8px 12px; cursor:pointer; font-size:13px; color:#555; border-bottom:2px solid transparent; margin-bottom:-2px; }
  .tabs button.active { color:#1A237E; border-bottom-color:#FF6F00; font-weight:600; }

  pre { background:#1e1e2e; color:#cdd6f4; padding:14px; border-radius:6px; font-family:'JetBrains Mono','Courier New',monospace; font-size:12px; overflow-x:auto; line-height:1.5; white-space:pre-wrap; }
  code.keyword { color:#f38ba8; }
  code.string { color:#a6e3a1; }
  code.value { color:#89b4fa; }

  .req-box { background:#f9fafc; border-left:4px solid #1A237E; padding:12px; border-radius:4px; font-size:13px; line-height:1.5; margin-bottom:12px; }
  .req-meta { font-size:11px; color:#888; margin-bottom:6px; }

  .field { margin-bottom:10px; }
  .field label { font-size:11px; color:#777; text-transform:uppercase; display:block; margin-bottom:3px; }
  .field .value { font-size:13px; color:#333; font-weight:500; }

  .scenario { background:#f9fafc; border-radius:6px; padding:10px 12px; margin-bottom:8px; border-left:3px solid #FF6F00; font-size:13px; }
  .scenario .stype { font-size:11px; color:#FF6F00; font-weight:700; text-transform:uppercase; }

  .confidence-bar { height:8px; background:#eee; border-radius:4px; overflow:hidden; margin:6px 0; }
  .confidence-bar .fill { height:100%; background:linear-gradient(90deg,#FF6F00,#2E7D32); }

  .trace-graph { display:flex; align-items:center; justify-content:space-between; padding:30px 0; flex-wrap:wrap; gap:10px; }
  .trace-node { background:#fff; border:2px solid #1A237E; padding:12px 18px; border-radius:10px; text-align:center; min-width:130px; box-shadow:0 2px 6px rgba(0,0,0,.08); }
  .trace-node .ttype { font-size:10px; color:#888; text-transform:uppercase; }
  .trace-node .tname { font-weight:600; font-size:13px; margin-top:4px; color:#1A237E; }
  .trace-arrow { font-size:24px; color:#FF6F00; }

  .cluster-mock { background:#0a0a0a; color:#FF6F00; border-radius:12px; padding:30px; text-align:center; font-family:monospace; margin:12px 0; }
  .cluster-mock .telltale { font-size:40px; margin:10px; display:inline-block; }
  .cluster-mock .telltale.on { color:#FF1744; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.3; } }

  .logs { background:#0a0a0a; color:#69F0AE; font-family:monospace; font-size:12px; padding:12px; border-radius:6px; height:240px; overflow-y:auto; }
  .logs .err { color:#FF5252; }
  .logs .warn { color:#FFD740; }

  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:900px) { .grid-2, .kpis { grid-template-columns:1fr 1fr; } }
  @media (max-width:600px) { .grid-2, .kpis { grid-template-columns:1fr; } }

  input, select, textarea { padding:8px 10px; border:1px solid #ddd; border-radius:6px; font-size:13px; font-family:inherit; width:100%; }
  textarea { resize:vertical; min-height:80px; }
  label.form-label { display:block; font-size:12px; color:#555; margin:8px 0 4px; font-weight:600; }

  .bench-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .bench-cluster { background: linear-gradient(135deg, #000, #1a1a1a); border-radius: 16px; padding: 30px; min-height: 320px; color: #fff; font-family: 'Consolas', monospace; }
  .bench-cluster.off { opacity: 0.3; }
  .bench-telltale { font-size: 32px; margin: 6px; display: inline-block; opacity: 0.15; transition: all 0.3s; }
  .bench-telltale.on { opacity: 1; animation: bench-blink 1s infinite; filter: drop-shadow(0 0 10px currentColor); }
  @keyframes bench-blink { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .bench-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eee; }
  .bench-row label { min-width: 130px; font-weight: 600; color: #1A237E; font-size: 13px; }
  .bench-row input[type=range] { flex: 1; }
  .bench-row select { padding: 6px 10px; border-radius: 6px; border: 1px solid #ccc; width:auto; }
  .bench-value { min-width: 60px; font-family: monospace; color: #FF6F00; font-weight: 700; text-align: right; }
  .bench-speedo { font-size: 60px; text-align: center; color: #FFB74D; margin: 20px 0; }
  .bench-stats { display: flex; justify-content: space-around; font-size: 14px; color: #69F0AE; }

  .voice-btn { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
               width: 56px; height: 56px; border-radius: 50%; background: #FF6F00;
               color: white; font-size: 28px; border: none; cursor: pointer;
               box-shadow: 0 4px 16px rgba(255,111,0,0.4); z-index: 500;
               display: flex; align-items: center; justify-content: center; }
  .voice-btn:hover { transform: translateX(-50%) scale(1.1); }
  .voice-btn.listening { background: #C62828; animation: voice-pulse 1s infinite; }
  @keyframes voice-pulse { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.15); box-shadow: 0 4px 24px rgba(198,40,40,0.8); } }
  .voice-transcript { position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
                      background: rgba(26,35,126,0.95); color: white; padding: 12px 24px;
                      border-radius: 24px; font-size: 16px; z-index: 600; max-width: 80%;
                      box-shadow: 0 4px 16px rgba(0,0,0,0.3); }

  /* Modal */
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:1000; }
  .modal-bg.show { display:flex; }
  .modal { background:#fff; border-radius:10px; padding:24px; width:90%; max-width:500px; max-height:85vh; overflow-y:auto; }
  .modal h2 { color:#1A237E; margin-bottom:14px; }

  /* Toast */
  .toast { position:fixed; bottom:50px; right:20px; background:#2E7D32; color:#fff; padding:12px 18px; border-radius:6px; box-shadow:0 4px 12px rgba(0,0,0,.2); z-index:2000; opacity:0; transition:opacity .3s; font-size:14px; }
  .toast.show { opacity:1; }
  .toast.err { background:#C62828; }

  /* Brain Bubble (bottom-left) */
  .brain-bubble { position:fixed; bottom:30px; left:20px; width:320px; background:#fff;
                  border:2px solid #1A237E; border-radius:14px;
                  box-shadow:0 8px 24px rgba(26,35,126,0.25); z-index:400; font-size:13px; }
  .brain-bubble.minimized { width:56px; height:56px; border-radius:50%; cursor:pointer;
                            display:flex; align-items:center; justify-content:center;
                            font-size:28px; background:#1A237E; }
  .brain-bubble.minimized::before { content:'🧠'; }
  .brain-bubble-header { display:flex; align-items:center; justify-content:space-between;
                         padding:8px 12px; border-bottom:1px solid #eee; }
  .brain-bubble-header span { font-weight:700; color:#1A237E; font-size:13px; }
  .brain-bubble-msgs { max-height:180px; overflow-y:auto; padding:6px 0; }
  .brain-msg { padding:8px 12px; margin:6px 8px; border-radius:12px; max-width:80%; font-size:12px; line-height:1.4; }
  .brain-msg.user { background:#E3F2FD; color:#1565C0; margin-left:auto; text-align:right; }
  .brain-msg.ai { background:#f5f5f5; color:#1A237E; margin-right:auto; }
  .brain-bubble-input { display:flex; gap:6px; padding:8px; border-top:1px solid #eee; }
  .brain-bubble-input input { flex:1; padding:6px 8px; border:1px solid #ddd; border-radius:8px; font-size:12px; }
  .brain-bubble-input button { padding:6px 10px; border:none; border-radius:8px; cursor:pointer; font-size:13px; }
  .brain-status { background:#E8F5E9; color:#2E7D32; padding:6px 12px; font-size:11px;
                  border-bottom:1px solid #C8E6C9; border-radius:12px 12px 0 0; }
  .brain-chip { display:inline-block; background:#FFF3E0; color:#E65100; padding:4px 10px;
                border-radius:12px; margin:2px; font-size:11px; cursor:pointer; border:1px solid #FFB74D; }
  .brain-chip:hover { background:#FFE0B2; }
  .typing-dots { display:inline-block; }
  .typing-dots span { animation:typing 1.4s infinite; opacity:0; }
  .typing-dots span:nth-child(2) { animation-delay:0.2s; }
  .typing-dots span:nth-child(3) { animation-delay:0.4s; }
  @keyframes typing { 0%,60%,100% { opacity:0; } 30% { opacity:1; } }

  /* Translator layout */
  .translator-cols { display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:start; margin-bottom:14px; }
  .glossary-table { font-size:12px; }
  .glossary-table td { padding:4px 8px; border-bottom:1px solid #eee; }

  /* Predictor risk bars */
  .risk-bar-wrap { display:flex; align-items:center; gap:8px; margin:4px 0; font-size:12px; }
  .risk-bar-bg { flex:1; height:16px; background:#eee; border-radius:4px; overflow:hidden; cursor:pointer; }
  .risk-bar-fill { height:100%; border-radius:4px; transition:width 0.4s; }
  .risk-high { background:#ef5350; }
  .risk-medium { background:#FFA726; }
  .risk-low { background:#66BB6A; }

  /* ROI section */
  .roi-line { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #eee; font-size:13px; }
  .roi-line .lbl { color:#555; }
  .roi-line .val { font-weight:700; color:#1A237E; }
</style>
</head>
<body>

<div class="topnav">
  <div class="logo">🔧 TestForge<span>AI</span></div>
  <nav id="topnav">
    <button data-view="dashboard" class="active">Dashboard</button>
    <button data-view="projects">Projects</button>
    <button data-view="requirements">Requirements</button>
    <button data-view="generator">Generator</button>
    <button data-view="automation">Automation</button>
    <button data-view="visual">Visual Validation</button>
    <button data-view="translator">🌐 Translator</button>
    <button data-view="bench">🎮 Bench</button>
    <button data-view="traceability">Traceability</button>
    <button data-view="predictor">🔮 Predictor</button>
    <button data-view="reports">Reports</button>
    <button data-view="brain">🧠 Brain</button>
    <button data-view="admin">Admin</button>
  </nav>
  <div class="user">👤 sanjanavanka</div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="workspace" id="workspace"></main>
</div>

<div class="statusbar">
  <span>🟢 <span class="ok">Polarion Connected</span></span>
  <span>Last Sync: <span id="lastSync">just now</span></span>
  <span>Active Pilot: Cluster Telltales</span>
  <span id="reqCount">5 requirements loaded</span>
</div>

<div class="modal-bg" id="modal">
  <div class="modal" id="modalContent"></div>
</div>
<div class="toast" id="toast"></div>
<button class="voice-btn" id="voiceBtn" onclick="toggleVoice()" title="Voice Commands">🎤</button>
<div class="voice-transcript" id="voiceTranscript" style="display:none;"></div>
<div id="brain-bubble"></div>

<script>
/* ===================================================================
   TestForge AI — Complete self-contained tool
   No backend, no dependencies. Uses localStorage for persistence.
   =================================================================== */

/* ---------------- Default Mock Data ---------------- */
const DEFAULT_DATA = {
  projects: [
    { name:'EV Cluster Program', oem:'OEM-A', domain:'Cluster', status:'Active', owner:'sanjanavanka', updated:'Today' },
    { name:'Cockpit Premium',     oem:'OEM-B', domain:'Cockpit + HUD', status:'Pilot', owner:'team-cockpit', updated:'2d ago' },
    { name:'ADAS HMI',            oem:'OEM-C', domain:'ADAS HMI', status:'Planning', owner:'team-adas', updated:'1w ago' },
  ],
  requirements: [
    { id:'CLU_001', title:'Seatbelt telltale on ignition', score:92, status:'Mapped',
      text:'When ignition is ON and seatbelt is unbuckled, the seatbelt telltale shall illuminate within 1 second.',
      trigger:'Ignition = ON AND Seatbelt = UNBUCKLED', expected:'Telltale_Seatbelt = ON', timing:'1000 ms', variants:['EU','US','EV'] },
    { id:'CLU_002', title:'Low fuel warning', score:78, status:'Reviewed',
      text:'If fuel level drops below 10%, the low fuel warning shall appear within 2 seconds.',
      trigger:'FuelLevel < 10%', expected:'Warning_LowFuel = ON', timing:'2000 ms', variants:['ICE','Hybrid'] },
    { id:'CLU_003', title:'Welcome screen on ignition', score:88, status:'Generated',
      text:'When ignition transitions to ON, the cluster shall display the welcome animation within 2 seconds.',
      trigger:'Ignition: OFF→ON', expected:'HMI_Screen = WELCOME', timing:'2000 ms', variants:['All'] },
    { id:'CLU_004', title:'ABS telltale fault', score:45, status:'Needs Review',
      text:'System shall properly indicate ABS warning quickly when fault is detected.',
      trigger:'(ambiguous)', expected:'(ambiguous)', timing:'(missing)', variants:['All'] },
    { id:'CLU_005', title:'Turn signal blink rate', score:95, status:'Generated',
      text:'When turn indicator is active, telltale shall blink at 1.5 Hz (±0.1 Hz).',
      trigger:'TurnSignal = LEFT|RIGHT', expected:'Telltale blinks @ 1.5Hz', timing:'periodic', variants:['All'] },
  ],
  tests: [
    { id:'TC_001', req:'CLU_001', name:'Seatbelt telltale nominal',  type:'Nominal',  framework:'CAPL',   status:'Pass' },
    { id:'TC_002', req:'CLU_001', name:'Seatbelt boundary 999ms',    type:'Boundary', framework:'Python', status:'Pass' },
    { id:'TC_003', req:'CLU_001', name:'Seatbelt signal timeout',    type:'Negative', framework:'CAPL',   status:'Fail' },
    { id:'TC_004', req:'CLU_001', name:'Seatbelt recovery',          type:'Recovery', framework:'Robot',  status:'Pass' },
    { id:'TC_005', req:'CLU_001', name:'Airbag vs Seatbelt priority',type:'Conflict', framework:'CAPL',   status:'Pass' },
  ],
  vocab: [
    { canonical:'IGNITION_ON',       a:'Ignition Active', b:'KL15 High',  c:'Terminal 15' },
    { canonical:'TELLTALE_SEATBELT', a:'Seatbelt Lamp',   b:'SBR Icon',   c:'Belt Warning' },
    { canonical:'READY_STATE',       a:'Drive Ready',     b:'HV Active',  c:'Vehicle Active' },
  ],
  scenarios: [
    { name: 'Idle Engine ON', signals: { Ignition: 'ON', VehicleSpeed: 0, FuelLevel: 50, Seatbelt_Driver: 'BUCKLED', TurnSignal: 'NONE', HeadLights: 'OFF', Doors_Open: 'CLOSED', EngineTemp: 90, BatteryVoltage: 12.5, ABS_Fault: 'OK' }, createdAt: '2025-01-15' },
    { name: 'Low Fuel Highway', signals: { Ignition: 'ON', VehicleSpeed: 120, FuelLevel: 8, Seatbelt_Driver: 'BUCKLED', TurnSignal: 'NONE', HeadLights: 'LOW', Doors_Open: 'CLOSED', EngineTemp: 95, BatteryVoltage: 12.3, ABS_Fault: 'OK' }, createdAt: '2025-01-15' },
    { name: 'Critical Multi-Fault', signals: { Ignition: 'ON', VehicleSpeed: 60, FuelLevel: 5, Seatbelt_Driver: 'UNBUCKLED', TurnSignal: 'HAZARD', HeadLights: 'OFF', Doors_Open: 'OPEN', EngineTemp: 115, BatteryVoltage: 10.5, ABS_Fault: 'FAULT' }, createdAt: '2025-01-15' }
  ],
  selectedReqId: 'CLU_001',
  voiceEnabled: true
};

/* ---------------- State (localStorage persistence) ---------------- */
const STORE_KEY = 'testforge_ai_v1';
function loadState() {
  try {
    const s = localStorage.getItem(STORE_KEY);
    if (s) return JSON.parse(s);
  } catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function saveState() { localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); }
function resetState() { localStorage.removeItem(STORE_KEY); STATE = JSON.parse(JSON.stringify(DEFAULT_DATA)); render(); toast('Data reset to defaults'); }
let STATE = loadState();
STATE.scenarios = Array.isArray(STATE.scenarios) ? STATE.scenarios : [];
STATE.voiceEnabled = STATE.voiceEnabled !== false;
STATE.brainHistory = Array.isArray(STATE.brainHistory) ? STATE.brainHistory : [];
STATE.brainMinimized = STATE.brainMinimized === true;
STATE.translatedRequirements = STATE.translatedRequirements && typeof STATE.translatedRequirements === 'object' ? STATE.translatedRequirements : {};
STATE.customTermbase = STATE.customTermbase && typeof STATE.customTermbase === 'object' ? STATE.customTermbase : {};
STATE.riskHistory = Array.isArray(STATE.riskHistory) ? STATE.riskHistory : [];
STATE.effortSaved = STATE.effortSaved && typeof STATE.effortSaved === 'object' ? STATE.effortSaved : { reqs:0, tests:0, scripts:0, traces:0, audits:0 };

/* ---------------- Helpers ---------------- */
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (isErr ? ' err':'');
  setTimeout(()=> t.className='toast', 2500);
}
function openModal(html) { document.getElementById('modalContent').innerHTML = html; document.getElementById('modal').classList.add('show'); }
function closeModal() { document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').onclick = (e) => { if (e.target.id==='modal') closeModal(); };

function selectedReq() { return STATE.requirements.find(r=>r.id===STATE.selectedReqId) || STATE.requirements[0]; }
function downloadFile(name, content, mime='text/plain') {
  const blob = new Blob([content], { type:mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

/* ---------------- Sidebar map ---------------- */
const SIDEBAR_MAP = {
  dashboard:    ['Overview','KPIs','Recent Activity','Alerts'],
  projects:     ['All Projects','Active','Pilots','Archived'],
  requirements: ['All Requirements','New','Reviewed','Mapped','Generated','Needs Review'],
  generator:    ['Active Requirement','Test Intent (ITM)','Scenarios','Interface Mapping','Automation Output','Visual Validation'],
  automation:   ['Test Suites','Environments','Schedules','Live Runs','Results'],
  visual:       ['Cluster View','Telltale Library','OCR Checks','Timing Analyzer'],
  translator:   ['Quick Translate','OEM Termbase','Bulk Translate'],
  bench:        ['Live Cluster', 'Saved Scenarios', 'Signal Library'],
  traceability: ['Graph View','Coverage Matrix','Evidence Pack','Change Impact'],
  predictor:    ['Risk Dashboard','High Risk Items','Heuristics','Recommendations'],
  reports:      ['Requirement Quality','Test Coverage','Automation Readiness','Compliance (ASPICE)','Productivity','ROI Dashboard'],
  brain:        ['Chat','Quick Prompts','History','Knowledge Tips'],
  admin:        ['Integrations','Vocabulary','Templates','Users','Data Management']
};

let currentView = 'dashboard';
function renderSidebar(view) {

];

function getBenchDefaults() {
  return BENCH_SIGNALS.reduce((acc, sig) => { acc[sig.id] = sig.default; return acc; }, {});
}
let benchSignals = getBenchDefaults();

function currentDateString() { return new Date().toISOString().slice(0,10); }

function normalizeBenchSignal(sig, value) {
  if (sig.type === 'range') return Number(value);
  return value;
}

function renderBenchRules() {
  const active = BENCH_RULES.filter(r => r.condition(benchSignals));
  const telltales = document.getElementById('bench-telltales');
  const cluster = document.getElementById('bench-cluster');
  if (!telltales || !cluster) return;

  telltales.innerHTML = BENCH_RULES.map(rule => {
    const on = active.some(a => a.id === rule.id);
    return `<span class="bench-telltale ${on ? 'on' : ''}" style="color:${rule.color}" title="${rule.label}">${rule.icon}</span>`;
  }).join('');

  cluster.classList.toggle('off', benchSignals.Ignition === 'OFF');
  document.getElementById('bench-speedo').textContent = `${Number(benchSignals.VehicleSpeed)} km/h`;
  document.getElementById('bench-fuel').textContent = `FUEL: ${Number(benchSignals.FuelLevel)}%`;
  document.getElementById('bench-temp').textContent = `TEMP: ${Number(benchSignals.EngineTemp)}°C`;
  document.getElementById('bench-batt').textContent = `BATT: ${Number(benchSignals.BatteryVoltage).toFixed(1)}V`;
  document.getElementById('bench-warning-count').textContent = `Active warnings: ${active.length}`;
  document.getElementById('bench-json').textContent = JSON.stringify(benchSignals, null, 2);
}

function syncBenchInputs() {
  BENCH_SIGNALS.forEach(sig => {
    const input = document.getElementById(`bench-input-${sig.id}`);
    const valueEl = document.getElementById(`bench-value-${sig.id}`);
    if (!input || !valueEl) return;
    input.value = benchSignals[sig.id];
    valueEl.textContent = sig.type === 'range' ? `${benchSignals[sig.id]}${sig.unit || ''}` : benchSignals[sig.id];
  });
  renderBenchRules();
}

function updateBenchSignal(id, rawValue) {
  const sig = BENCH_SIGNALS.find(s => s.id === id);
  if (!sig) return;
  benchSignals[id] = normalizeBenchSignal(sig, rawValue);
  const valueEl = document.getElementById(`bench-value-${sig.id}`);
  if (valueEl) valueEl.textContent = sig.type === 'range' ? `${benchSignals[sig.id]}${sig.unit || ''}` : benchSignals[sig.id];
  renderBenchRules();
}

function loadBenchScenario(name) {
  const scenario = STATE.scenarios.find(sc => sc.name === name);
  if (!scenario) return;
  benchSignals = { ...getBenchDefaults(), ...scenario.signals };
  syncBenchInputs();
  toast(`Scenario loaded: ${name} ✓`);
}

function resetBenchSignals() {
  benchSignals = getBenchDefaults();
  syncBenchInputs();
  toast('Bench reset to defaults ✓');
}

function saveBenchScenario() {
  openModal(`
    <h2>💾 Save Scenario</h2>

    <input id='benchScenarioName' placeholder='e.g. Night Drive / ABS Fault'/>

function confirmSaveBenchScenario() {
  const input = document.getElementById('benchScenarioName');
  const name = input ? input.value.trim() : '';
  if (!name) return toast('Scenario name required', true);
  STATE.scenarios.unshift({ name, signals: { ...benchSignals }, createdAt: currentDateString() });
  saveState();
  closeModal();
  setView('bench');
  toast(`Scenario saved: ${name} ✓`);
}

function generateTestFromBenchState() {
  const req = STATE.requirements.find(r => r.id === STATE.selectedReqId);
  if (!req) return toast('Select a requirement first', true);
  const nums = STATE.tests.map(t => Number((t.id || '').replace('TC_',''))).filter(n => Number.isFinite(n));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  const id = `TC_${String(next).padStart(3,'0')}`;
  STATE.tests.unshift({ id, req: req.id, name: `Bench state validation for ${req.id}`, type: 'State', framework: 'Manual', status: 'Draft', preconditions: JSON.stringify(benchSignals) });
  saveState();
  toast(`Generated ${id} from bench state ✓`);
}

let voiceRecognition = null;
let voiceListening = false;
let voiceTranscriptTimer = null;

function updateVoiceBtn() {
  const btn = document.getElementById('voiceBtn');
  if (!btn) return;
  btn.classList.toggle('listening', voiceListening);
  btn.style.display = STATE.voiceEnabled === false ? 'none' : 'flex';
}

function showVoiceTranscript(transcript) {
  const el = document.getElementById('voiceTranscript');
  if (!el) return;
  el.textContent = `🎤 ${transcript}`;
  el.style.display = 'block';
  clearTimeout(voiceTranscriptTimer);
  voiceTranscriptTimer = setTimeout(() => { el.style.display = 'none'; }, 3000);
}

function speakResponse(text) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.0;
  u.pitch = 1.0;
  window.speechSynthesis.speak(u);
}

function processVoiceCommand(transcript) {
  const t = transcript.toLowerCase().trim();
  const ackVoice = () => toast(`Voice: ${transcript} ✓`);
  const go = (view, msg) => {
    setView(view);
    toast(msg);
    ackVoice();
    return true;
  };

  if (t.includes('dashboard')) return go('dashboard', '✓ Dashboard');
  if (t.includes('requirements')) return go('requirements', '✓ Requirements');
  if (t.includes('doctor')) return go('doctor', '✓ Doctor');
  if (t.includes('generator') || t.includes('generate')) return go('generator', '✓ Generator');
  if (t.includes('automation')) return go('automation', '✓ Automation');
  if (t.includes('visual')) return go('visual', '✓ Visual');
  if (t.includes('traceability') || t.includes('trace')) return go('traceability', '✓ Traceability');
  if (t.includes('impact') || t.includes('time machine')) return go('impact', '✓ Impact');
  if (t.includes('reports')) return go('reports', '✓ Reports');
  if (t.includes('admin')) return go('admin', '✓ Admin');
  if (t.includes('virtual bench') || t.includes('bench')) return go('bench', '✓ Bench');

  const reqMatch = t.match(/(?:show me|open)\s+(clu[\s_\-]?\d+)/i);
  if (reqMatch) {
    const reqId = reqMatch[1].toUpperCase().replace(/[\s\-]/g, '_');
    const req = STATE.requirements.find(r => r.id === reqId);
    if (req) {
      STATE.selectedReqId = req.id;
      saveState();
      setView('requirements');
      toast(`✓ Opened ${req.id}`);
      ackVoice();
      return true;
    }
  }

  if (t === 'hello' || t === 'hi testforge') {
    speakResponse('Hello! What can I help you validate?');
    ackVoice();
    return true;
  }

  if (t === 'help' || t === 'what can you do') {
    speakResponse('Try saying dashboard, requirements, open virtual bench, open CLU underscore zero zero one, or automation.');
    ackVoice();
    return true;
  }

  toast(`🎤 Not recognized: '${transcript}'`, true);
  return false;
}

function initVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.continuous = false;
  r.interimResults = false;
  r.lang = 'en-US';
  r.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    showVoiceTranscript(transcript);
    processVoiceCommand(transcript);
  };
  r.onerror = (e) => toast('🎤 Voice error: ' + e.error, true);
  r.onend = () => {
    voiceListening = false;
    updateVoiceBtn();
  };
  return r;
}

function toggleVoice() {
  if (!voiceRecognition) voiceRecognition = initVoice();
  if (!voiceRecognition) {
    toast('🎤 Voice not supported. Use Chrome or Edge.', true);
    return;
  }
  if (voiceListening) {
    voiceRecognition.stop();
    voiceListening = false;
  } else {
    voiceRecognition.start();
    voiceListening = true;
    toast('🎤 Listening...');
  }
  updateVoiceBtn();
}

function addReq() {
  const id = document.getElementById('ar_id').value.trim();

  if (!id || !title || !text) return toast('All fields required', true);
  const lint = lintRequirement(text);
  STATE.requirements.unshift({ id, title, text, ...lint, status:'New', variants:['All'] });
  saveState(); closeModal(); render(); toast('Requirement added ✓');
}
function lintRequirement(text) {
  const t = text.toLowerCase();
  let score = 50;
  const vague = ['quickly','properly','correctly','adequately','normally','soon'];
  const hasVague = vague.some(v=>t.includes(v));
  const hasTrigger = /\b(when|if|after|upon)\b/.test(t);
  const hasShall = t.includes('shall');
  const hasTiming = /\d+\s*(ms|second|s|hz)/.test(t);
  if (hasTrigger) score += 15;
  if (hasShall) score += 15;
  if (hasTiming) score += 20;
  if (hasVague) score -= 25;
  score = Math.max(10, Math.min(99, score));
  return {
    score,
    trigger: hasTrigger ? text.match(/\b(when|if|after|upon)[^,]+/i)?.[0] || 'detected' : '(ambiguous)',
    expected: hasShall ? text.match(/shall[^.]+/i)?.[0] || 'detected' : '(ambiguous)',
    timing: hasTiming ? text.match(/\d+\s*(ms|second|s|hz)/i)?.[0] : '(missing)'
  };
}

function translateText(text, sourceOEM, targetOEM) {
  let translated = text;
  const changes = [];
  // First reverse-map source OEM terms back to generic English keys
  const srcMap = OEM_TERMBASE[sourceOEM] || {};
  Object.entries(srcMap).forEach(([generic, oem]) => {
    const re = new RegExp(oem.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    if (re.test(translated)) {
      translated = translated.replace(re, generic);
    }
  });
  // Then map generic → target OEM
  const tgtMap = OEM_TERMBASE[targetOEM] || {};
  // Also apply custom termbase
  const combined = Object.assign({}, tgtMap, STATE.customTermbase[targetOEM] || {});
  Object.entries(combined).forEach(([generic, oem]) => {
    const re = new RegExp('\\b' + generic.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi');
    if (re.test(translated)) {
      translated = translated.replace(re, oem);
      changes.push({ from: generic, to: oem });
    }
  });
  return { translated, changes };
}

/* ============ RISK / DEFECT PREDICTOR ============ */
function calculateRisk(req) {
  let score = 0;
  const t = (req.text || '').toLowerCase();
  const vague = ['quickly','properly','correctly','adequately','normally','soon'];
  if (req.score < 60) score += 30; else if (req.score < 85) score += 15;
  if (t.length > 200) score += 20; else if (t.length > 100) score += 10;
  if (!req.timing || req.timing === '(missing)') score += 15;
  if (vague.some(w => t.includes(w))) score += 15;
  const sevenDaysAgo = Date.now() - 7*24*60*60*1000;
  if (req.lastModified && new Date(req.lastModified).getTime() > sevenDaysAgo) score += 10;
  if (req.variants && req.variants.length > 5) score += 5;
  const linked = STATE.tests.filter(tc => tc.req === req.id);
  if (linked.some(tc => tc.status === 'Fail')) score += 5;
  return Math.min(100, score);
}

function topRiskFactor(req) {
  const t = (req.text || '').toLowerCase();
  const vague = ['quickly','properly','correctly','adequately','normally','soon'];
  if (req.score < 60) return 'Low quality score';
  if (!req.timing || req.timing === '(missing)') return 'No timing specified';
  if (vague.some(w => t.includes(w))) return 'Vague words present';
  if (t.length > 200) return 'High complexity';
  if (req.variants && req.variants.length > 5) return 'Many variants';
  return 'Multiple minor factors';
}

function riskAction(req) {
  const t = (req.text || '').toLowerCase();
  const vague = ['quickly','properly','correctly','adequately','normally','soon'];
  if (req.score < 60) return 'Run Linting — fix quality issues';
  if (!req.timing || req.timing === '(missing)') return 'Add measurable timing parameter';
  if (vague.some(w => t.includes(w))) return 'Replace vague terms with measurable criteria';
  if (req.variants && req.variants.length > 5) return 'Split into multiple requirements';
  return 'Re-run all linked tests';
}

/* ============ JIRA EXPORTER ============ */
function estimateStoryPoints(req) {
  const t = (req.text || '');
  const vague = ['quickly','properly','correctly','adequately','normally','soon'];
  const hasVague = vague.some(w => t.toLowerCase().includes(w));
  if (req.variants && req.variants.length > 5) return 8;
  if (t.length > 200 && (t.match(/and|or/gi)||[]).length > 3) return 13;
  if (req.score >= 85 && req.timing && req.timing !== '(missing)' && req.trigger && req.trigger !== '(ambiguous)') return 2;
  if (req.score >= 60) return 3;
  if (req.score < 60 || hasVague) return 5;
  return 3;
}

function processLLMQuery(question) {
  const q = question.toLowerCase().trim();

  // Greeting
  if (/^(hello|hi|hey|good morning|good afternoon)/.test(q)) {
    return 'Hello! 👋 I\'m the TestForge AI Brain — running fully offline.\n\nI can help you with:\n- **Explain** a requirement (try "explain CLU_001")\n- **Diagnose** test failures ("why did TC_003 fail")\n- **Improve** requirements ("improve CLU_004")\n- **Generate** edge cases ("edge cases for CLU_002")\n- **Summarize** your project ("summarize project")\n\nWhat would you like to know?';
  }

  // Explain requirement
  const explainMatch = q.match(/explain\s+(clu[\s_\-]?\d+)/i);
  if (explainMatch) {
    const reqId = explainMatch[1].toUpperCase().replace(/[\s\-]/g,'_');
    const req = STATE.requirements.find(r => r.id === reqId);
    if (req) {
      const lint = lintRequirement(req.text);
      return '**' + req.id + ': ' + req.title + '**\n\n' +
        req.text + '\n\n' +
        '**Linting Analysis:**\n' +
        '- Testability score: ' + req.score + '%\n' +
        '- Trigger: ' + req.trigger + '\n' +
        '- Expected: ' + req.expected + '\n' +
        '- Timing: ' + req.timing + '\n' +
        '- Variants: ' + (req.variants||[]).join(', ') + '\n\n' +
        (req.score < 60 ? '⚠️ **Suggestion:** This requirement has a low score. Add measurable timing and remove vague terms.' :
         req.score < 85 ? '💡 **Suggestion:** Good requirement. Adding timing precision would push score above 85%.' :
         '✅ **Well-formed requirement** — ready for test generation.');
    }
    return 'Requirement ' + explainMatch[1].toUpperCase() + ' not found in current STATE. Try one of: ' + STATE.requirements.map(r=>r.id).join(', ');
  }

  // Why did a test fail
  const failMatch = q.match(/why.*(tc[\s_\-]?\d+|test\s+\d+)/i);
  if (failMatch || (q.includes('why') && q.includes('fail'))) {
    let tcId = failMatch ? failMatch[1].toUpperCase().replace(/[\s\-]/g,'_') : null;
    const tc = tcId ? STATE.tests.find(t => t.id === tcId) : STATE.tests.find(t => t.status === 'Fail');
    if (tc) {
      return '**' + tc.id + ': ' + tc.name + '** — Status: ' + tc.status + '\n\n' +
        '**3 Probable Causes based on test type (' + tc.type + '):**\n' +
        (tc.type === 'Negative' || tc.type === 'Timeout' ?
          '1. Signal did not return to default state within timeout window\n2. CAN bus message was not transmitted after stimulus removal\n3. Precondition state was not correctly established before test' :
        tc.type === 'Boundary' ?
          '1. Timing boundary exceeded by 1–5 ms (timing jitter on HIL bench)\n2. Signal threshold value mismatch between DBC and requirement\n3. Clock synchronization issue between stimulus and measurement' :
          '1. Signal mapping mismatch — verify DBC signal name vs. test script\n2. Precondition not met — check initial state setup\n3. Timing window too tight — verify requirement tolerance') + '\n\n' +
        '**Linked requirement:** ' + tc.req + '\n**Framework:** ' + tc.framework + '\n\n' +
        '💡 Open the Automation view to re-run this test with debug logging.';
    }
    return 'No failing test found. All current tests may be passing. Check the Automation view for the latest run results.';
  }

  // Improve / suggest
  const improveMatch = q.match(/(?:improve|suggest|fix|enhance)\s+(clu[\s_\-]?\d+)/i);
  if (improveMatch || q.includes('improve') || q.includes('suggest improvement')) {
    const reqId = improveMatch ? improveMatch[1].toUpperCase().replace(/[\s\-]/g,'_') : STATE.selectedReqId;
    const req = STATE.requirements.find(r => r.id === reqId) || selectedReq();
    const t = req.text.toLowerCase();
    const suggestions = [];
    if (!req.timing || req.timing === '(missing)') suggestions.push('Add measurable timing (e.g., "within 500 ms")');
    if (['quickly','properly','correctly','adequately','normally','soon'].some(w=>t.includes(w))) suggestions.push('Replace vague words with quantifiable criteria');
    if (!req.trigger || req.trigger === '(ambiguous)') suggestions.push('Add explicit trigger condition (When/If/After)');
    if (!req.expected || req.expected === '(ambiguous)') suggestions.push('Add clear "shall" expected result statement');
    if (!suggestions.length) suggestions.push('Requirement looks well-formed! Consider adding more variant coverage.');
    return '**Improvement suggestions for ' + req.id + '** (score: ' + req.score + '%):\n\n' +
      suggestions.map((s,i) => (i+1) + '. ' + s).join('\n') + '\n\n' +
      '**Current text:**\n' + req.text + '\n\nFix these issues to raise the testability score above 85%.';
  }

  // Edge cases
  if (q.includes('edge case') || q.includes('negative') || q.includes('boundary')) {
    const req = selectedReq();
    return '**5 Edge Cases for ' + req.id + ' (' + req.title + '):**\n\n' +
      '1. **Simultaneous fault:** Trigger active + competing higher-priority warning\n' +
      '2. **Power cycle:** Ignition cycle mid-operation — verify state recovery\n' +
      '3. **CAN timeout:** Signal source lost for >500 ms — verify default/safe state\n' +
      '4. **Boundary value:** Condition at exactly the threshold (e.g., 10% fuel)\n' +
      '5. **Rapid toggle:** Trigger applied and removed within 100 ms — verify no flicker\n\n' +
      '💡 Open the Generator → Scenarios tab to auto-add these to your test suite.';
  }

  // Compare two requirements
  const compareMatch = q.match(/(clu[\s_\-]?\d+)\s+(?:and|vs|versus|compare)\s+(clu[\s_\-]?\d+)/i);
  if (compareMatch || q.includes('compare')) {
    const id1 = compareMatch ? compareMatch[1].toUpperCase().replace(/[\s\-]/g,'_') : STATE.requirements[0]?.id;
    const id2 = compareMatch ? compareMatch[2].toUpperCase().replace(/[\s\-]/g,'_') : STATE.requirements[1]?.id;
    const r1 = STATE.requirements.find(r=>r.id===id1);
    const r2 = STATE.requirements.find(r=>r.id===id2);
    if (r1 && r2) {
      return '**Comparison: ' + r1.id + ' vs ' + r2.id + '**\n\n' +
        '| Attribute | ' + r1.id + ' | ' + r2.id + ' |\n' +
        '|---|---|---|\n' +
        '| Title | ' + r1.title + ' | ' + r2.title + ' |\n' +
        '| Score | ' + r1.score + '% | ' + r2.score + '% |\n' +
        '| Timing | ' + r1.timing + ' | ' + r2.timing + ' |\n' +
        '| Variants | ' + (r1.variants||[]).length + ' | ' + (r2.variants||[]).length + ' |\n' +
        '| Status | ' + r1.status + ' | ' + r2.status + ' |';
    }
  }

  // Summarize project
  if (q.includes('summar') || q.includes('overview') || q.includes('status')) {
    const reqs = STATE.requirements;
    const tests = STATE.tests;
    const pass = tests.filter(t=>t.status==='Pass').length;
    const ready = Math.round(reqs.filter(r=>r.score>=80).length/Math.max(reqs.length,1)*100);
    return '**Project Summary — EV Cluster Program**\n\n' +
      '- 📑 Requirements: ' + reqs.length + ' (' + reqs.filter(r=>r.score>=85).length + ' high quality)\n' +
      '- 🧪 Tests: ' + tests.length + ' (' + pass + ' passing, ' + (tests.length-pass) + ' failing)\n' +
      '- 🎮 Scenarios: ' + STATE.scenarios.length + ' saved\n' +
      '- 📊 Automation-ready: ' + ready + '%\n' +
      '- 🔗 Trace coverage: 94%\n\n' +
      (ready < 80 ? '⚠️ Several requirements need quality improvements before test generation.' :
       '✅ Project is in good shape for test generation.');
  }

  // Best practice / how to
  if (q.includes('best practice') || q.includes('how to') || q.includes('howto')) {
    const words = q.split(/\s+/);
    const tip = LLM_TIPS.find(tip => words.some(w => tip.kw.includes(w) || w.includes(tip.kw)));
    if (tip) return '💡 **' + tip.kw.charAt(0).toUpperCase() + tip.kw.slice(1) + ' Best Practice:**\n\n' + tip.tip;
    return '💡 **General Best Practice:**\n\n' + LLM_TIPS[LLM_TIPS.length-1].tip;
  }

  // Route to generator
  if (q.includes('generate') && (q.includes('capl') || q.includes('python') || q.includes('robot'))) {
    setTimeout(() => setView('generator'), 800);
    return '🚀 Routing you to the Generator for ' + (selectedReq().id) + '...\n\nI\'ll open the Output tab with your selected framework. Make sure the right requirement is selected!';
  }

  // Keyword tip search
  const tip = LLM_TIPS.find(t => q.includes(t.kw));
  if (tip) return '💡 **' + tip.kw.charAt(0).toUpperCase() + tip.kw.slice(1) + ' Tip:**\n\n' + tip.tip;

  return 'I can help with: requirements, tests, scripts, edge cases, and best practices.\n\nTry asking:\n- "explain CLU_001"\n- "why did TC_003 fail"\n- "edge cases for CLU_002"\n- "best practice for CAPL"\n- "summarize project"';
}

function selectReq(id) { STATE.selectedReqId = id; saveState(); render(); }
function sendToGen(id) { STATE.selectedReqId = id; saveState(); setView('generator'); }
function lintAll() {
  STATE.requirements.forEach(r => { const l = lintRequirement(r.text); r.score = l.score; });
  saveState(); render(); toast('Linting complete on all requirements ✓');
}
function importReqs() { document.getElementById('reqFile').click(); }
function handleReqFile(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      let imported = [];
      if (file.name.endsWith('.json')) {
        imported = JSON.parse(ev.target.result);
      } else {
        // simple CSV: id,title,text
        const lines = ev.target.result.split(/\r?\n/).filter(l=>l.trim());
        imported = lines.slice(1).map(l => {
          const [id,title,text] = l.split(',');
          const lint = lintRequirement(text||'');
          return { id:id?.trim(), title:title?.trim(), text:text?.trim()||'', ...lint, status:'New', variants:['All'] };
        });
      }
      STATE.requirements = imported.concat(STATE.requirements);
      saveState(); render(); toast(`Imported ${imported.length} requirements ✓`);
    } catch(err) { toast('Import failed: '+err.message, true); }
  };
  reader.readAsText(file);
}

  downloadFile('roi_report.txt', content);
  toast('ROI report exported ✓');
}

function swapOEMs() {
  const src = document.getElementById('trans-src');
  const tgt = document.getElementById('trans-tgt');
  if (!src || !tgt) return;
  const tmp = src.value; src.value = tgt.value; tgt.value = tmp;
}

function copyTranslation() {
  const el = document.getElementById('trans-result');
  if (el && navigator.clipboard) {
    navigator.clipboard.writeText(el.textContent).then(() => toast('Copied ✓'));
  } else toast('Copy not supported in this browser', true);
}

function runTranslation() {
  const text = (document.getElementById('trans-input') || {}).value || '';
  if (!text.trim()) return toast('Enter text to translate', true);
  const src = document.getElementById('trans-src').value;
  const tgt = document.getElementById('trans-tgt').value;
  const { translated, changes } = translateText(text, src, tgt);
  document.getElementById('trans-original').textContent = text;
  document.getElementById('trans-result').textContent = translated;
  const tbody = document.getElementById('trans-glossary');
  tbody.innerHTML = changes.length
    ? changes.map(c => '<tr><td>' + c.from + '</td><td>→</td><td><strong>' + c.to + '</strong></td></tr>').join('')
    : '<tr><td colspan="3" style="color:#888;">No term replacements found for this OEM pair.</td></tr>';
  document.getElementById('trans-output-card').style.display = 'block';
  toast('Translation complete ✓');
}

function bulkTranslateAll() {
  const tgt = document.getElementById('trans-tgt') ? document.getElementById('trans-tgt').value : 'BMW';
  const translated = STATE.requirements.map(req => {
    const { translated: t } = translateText(req.text, 'Generic', tgt);
    return Object.assign({}, req, { text: t, id: req.id + '_' + tgt });
  });
  STATE.translatedRequirements[tgt] = translated;
  saveState();
  toast('Bulk translate complete — ' + translated.length + ' requirements → ' + tgt + ' ✓');
}

function openAddTermModal() {
  openModal('<h2>+ Add Custom Term</h2>' +
    '<label class="form-label">OEM</label><select id="ct-oem">' + Object.keys(OEM_TERMBASE).map(o=>'<option>'+o+'</option>').join('') + '</select>' +
    '<label class="form-label">Generic Term</label><input id="ct-generic" placeholder="e.g. cluster"/>' +
    '<label class="form-label">OEM-Specific Term</label><input id="ct-specific" placeholder="e.g. Kombi"/>' +
    '<div class="actions"><button class="primary" onclick="addCustomTerm()">Add</button><button class="secondary" onclick="closeModal()">Cancel</button></div>');
}

function addCustomTerm() {
  const oem = document.getElementById('ct-oem').value;
  const generic = document.getElementById('ct-generic').value.trim();
  const specific = document.getElementById('ct-specific').value.trim();
  if (!generic || !specific) return toast('Both fields required', true);
  if (!STATE.customTermbase[oem]) STATE.customTermbase[oem] = {};
  STATE.customTermbase[oem][generic] = specific;
  saveState(); closeModal(); toast('Custom term added ✓');
}

VIEWS.predictor = () => {
  const reqs = STATE.requirements;
  const risks = reqs.map(r => ({ req: r, score: calculateRisk(r) })).sort((a,b) => b.score - a.score);
  const high = risks.filter(r => r.score >= 70).length;
  const med  = risks.filter(r => r.score >= 40 && r.score < 70).length;
  const low  = risks.filter(r => r.score < 40).length;
  const avg  = risks.length ? Math.round(risks.reduce((s,r)=>s+r.score,0)/risks.length) : 0;
  // Save snapshot to history
  STATE.riskHistory.push({ ts: Date.now(), avg });
  if (STATE.riskHistory.length > 30) STATE.riskHistory.shift();
  saveState();
  return `
  <div class="kpis">
    <div class="kpi"><div class="label">🔴 High Risk</div><div class="value">${high}</div><div class="delta">≥ 70% risk</div></div>
    <div class="kpi"><div class="label">🟡 Medium Risk</div><div class="value">${med}</div><div class="delta">40–69% risk</div></div>
    <div class="kpi"><div class="label">🟢 Low Risk</div><div class="value">${low}</div><div class="delta">&lt; 40% risk</div></div>
    <div class="kpi"><div class="label">📊 Avg Risk Score</div><div class="value">${avg}%</div><div class="delta">${avg>=70?'🔴 High':avg>=40?'🟡 Medium':'🟢 Low'}</div></div>
  </div>

  <div class="card">
    <h2>📊 Risk Heat Map</h2>
    <p style="font-size:12px;color:#888;margin-bottom:10px;">Click a bar to open that requirement.</p>
    ${risks.map(({req,score}) => {
      const cls = score >= 70 ? 'risk-high' : score >= 40 ? 'risk-medium' : 'risk-low';
      const color = score >= 70 ? '#ef5350' : score >= 40 ? '#FFA726' : '#66BB6A';
      return '<div class="risk-bar-wrap">' +
        '<span style="min-width:70px;font-weight:600;font-size:12px;">' + req.id + '</span>' +
        '<div class="risk-bar-bg" onclick="selectReq(\'' + req.id + '\');setView(\'requirements\')" title="' + req.title + '">' +
        '<div class="risk-bar-fill ' + cls + '" style="width:' + score + '%"></div></div>' +
        '<span style="min-width:40px;font-weight:700;color:' + color + ';">' + score + '%</span></div>';
    }).join('')}
  </div>

  <div class="card">
    <h2>⚠️ Risk Items Table</h2>
    <div class="actions" style="margin-bottom:12px;">
      <button class="primary" onclick="exportRiskReport()">📋 Export Risk Report</button>
      <button class="secondary" onclick="openRiskSuggestionsModal()">💡 Get AI Suggestions</button>
    </div>
    <table>
      <tr><th>Req ID</th><th>Title</th><th>Risk Score</th><th>Top Risk Factor</th><th>Recommended Action</th></tr>
      ${risks.map(({req,score}) => {
        const cls = score>=70?'red':score>=40?'yellow':'green';
        return '<tr class="clickable" onclick="selectReq(\'' + req.id + '\');setView(\'requirements\')">' +
          '<td><b>' + req.id + '</b></td><td>' + req.title + '</td>' +
          '<td><span class="badge ' + cls + '">' + score + '%</span></td>' +
          '<td style="font-size:12px;">' + topRiskFactor(req) + '</td>' +
          '<td style="font-size:12px;color:#555;">' + riskAction(req) + '</td></tr>';
      }).join('')}
    </table>
  </div>
  `;
};

function exportRiskReport() {
  const risks = STATE.requirements.map(r => ({ req: r, score: calculateRisk(r) })).sort((a,b) => b.score - a.score);
  const lines = ['TESTFORGE AI — RISK REPORT', 'Generated: ' + new Date().toISOString(), '='.repeat(50), ''];
  risks.forEach(({req,score}) => {
    lines.push(req.id + ' | ' + req.title);
    lines.push('  Risk Score: ' + score + '% (' + (score>=70?'HIGH':score>=40?'MEDIUM':'LOW') + ')');
    lines.push('  Top Factor: ' + topRiskFactor(req));
    lines.push('  Action: ' + riskAction(req));
    lines.push('');
  });
  downloadFile('risk_report.txt', lines.join('\n'));
  toast('Risk report exported ✓');
}

function openRiskSuggestionsModal() {
  const risks = STATE.requirements.map(r => ({ req:r, score:calculateRisk(r) }))
    .filter(({score}) => score >= 40).sort((a,b) => b.score - a.score).slice(0,5);
  const html = '<h2>💡 AI Risk Reduction Suggestions</h2><div style="font-size:13px;">' +
    (risks.length ? risks.map(({req,score},i) =>
      '<div style="margin-bottom:12px;padding:10px;background:#f9fafc;border-left:3px solid ' + (score>=70?'#ef5350':'#FFA726') + ';border-radius:4px;">' +
      '<b>' + (i+1) + '. ' + req.id + '</b> — Risk: ' + score + '%<br>' +
      '<span style="color:#555;">Action: ' + riskAction(req) + '</span></div>').join('')
    : '<p style="color:#888;">No high-risk items found. Great job!</p>') +
    '</div><div class="actions"><button class="secondary" onclick="closeModal()">Close</button></div>';
  openModal(html);
}

function sendBrainMessageFromView() {
  const input = document.getElementById('brain-input');
  if (!input || !input.value.trim()) return;
  const q = input.value.trim();
  input.value = '';
  STATE.brainHistory.push({ role:'user', text:q, timestamp:Date.now() });
  saveState();
  // Show typing indicator
  const chat = document.getElementById('brain-chat');
  if (chat) {
    const typing = document.createElement('div');
    typing.id = 'brain-typing';
    typing.style.cssText = 'display:flex;justify-content:flex-start;margin-bottom:10px;';
    typing.innerHTML = '<div class="brain-msg ai"><div class="typing-dots"><span>●</span><span>●</span><span>●</span></div></div>';
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;
  }
  setTimeout(() => {
    const response = processLLMQuery(q);
    STATE.brainHistory.push({ role:'ai', text:response, timestamp:Date.now() });
    saveState();
    setView('brain');
    renderBrainBubble();
  }, 600);
}

function exportData() {
  downloadFile('testforge_backup_'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(STATE, null, 2), 'application/json');
  toast('Data exported ✓');
}
function importData(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = (ev) => {
    try { STATE = JSON.parse(ev.target.result); saveState(); render(); toast('Data imported ✓'); }
    catch(err) { toast('Import failed: '+err.message, true); }
  };
  r.readAsText(f);
}
